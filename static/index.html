<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduEval · AI 生成 K-12 课件质量评测</title>
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js：总分仪表盘 / 九维雷达 / 维度条形 / 一致性环形 / 规则分布 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">

    <!-- ============ 侧栏：历史会话 ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <span class="logo">EE</span>
          <div class="brand-text">
            <strong>EduEval</strong>
            <span>K-12 课件质量评测</span>
          </div>
        </div>
        <button id="newChatBtn" class="btn-new">＋ 新建评测</button>
      </div>

      <div class="conv-list" id="convList">
        <div class="loading">加载中…</div>
      </div>

      <div class="sidebar-foot">
        <div class="status" id="healthBadge">
          <span class="dot dot-grey"></span>
          <span>检查中…</span>
        </div>
      </div>
    </aside>

    <!-- ============ 主区：对话流 ============ -->
    <main class="chat">
      <header class="chat-head">
        <button class="icon-btn" id="menuBtn" title="切换会话列表">☰</button>
        <div class="chat-title">
          <span id="chatTitle">新评测</span>
          <span class="chat-sub" id="chatSub"></span>
        </div>
        <div class="head-right">
          <span class="head-model" id="headModel"></span>
        </div>
      </header>

      <div class="messages" id="messages">
        <!-- 空态 -->
        <div class="welcome" id="welcome">
          <div class="welcome-inner">
            <div class="welcome-logo">EE</div>
            <h2>把课件交给 EduEval 评一评</h2>
            <p>粘贴一份 AI 生成的教案或课件，系统会从 9 个维度给出评分，
               用规则层零成本拦截知识性硬伤，并用双采样自一致压住 LLM 打分的随机性。</p>

            <div class="welcome-demo">
              <div class="welcome-demo-title">或直接从演示样本开始</div>
              <div class="demo-grid" id="demoButtons">
                <span class="loading">加载中…</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ============ 输入区 ============ -->
      <div class="composer">
        <div class="composer-tools">
          <label class="tool">
            <span>年级</span>
            <select id="gradeSelect"><option value="">加载中…</option></select>
          </label>
          <label class="tool chk">
            <input type="checkbox" id="dualSampleCheck" checked>
            <span>双采样自一致</span>
          </label>
          <label class="tool">
            <span>分差阈值</span>
            <input type="number" id="dualThresholdInput" value="1" min="0" max="4">
          </label>
          <span class="tool-spacer"></span>
          <button class="tool-btn" id="attachBtn">上传 .md/.txt/.pdf</button>
          <input type="file" id="fileInput" accept=".md,.txt,.pdf" hidden>
          <span class="counter" id="charCount">0 字</span>
        </div>

        <div class="composer-input">
          <textarea id="textInput" rows="1"
            placeholder="粘贴课件 / 教案文本，或上传文件…　（⌘/Ctrl + Enter 发送）"></textarea>
          <button id="sendBtn" class="send" title="发送">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a.99.99 0 00-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"
                    fill="currentColor"></path>
            </svg>
          </button>
        </div>
        <div class="composer-foot">
          <span id="composerHint" class="composer-hint"></span>
          <span class="kbd-hint">按 <span class="kbd">⌘</span><span class="kbd">Enter</span> 发送</span>
        </div>
      </div>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>
  <script src="app.js"></script>
</body>
</html>
